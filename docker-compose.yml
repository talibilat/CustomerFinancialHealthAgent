services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["uv", "run", "migrate-and-seed"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"

volumes:
  db-data:
