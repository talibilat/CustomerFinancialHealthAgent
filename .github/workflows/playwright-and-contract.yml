name: Playwright and generated client

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playwright-and-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-client:
    name: Generated client is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: 0.9.30
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate and compare the API contract
        run: ./scripts/check-generated-client.sh

  browser-journeys:
    name: Browser journeys without Azure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_COMPOSE_PROJECT_NAME: cfha-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and its operating-system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run against a freshly built isolated application
        working-directory: frontend
        run: npm run test:e2e
