name: Playwright and generated client

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playwright-and-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend component tests
        working-directory: frontend
        run: npm run test

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

  backend-tests:
    name: Backend tests against PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cfha
          POSTGRES_PASSWORD: cfha_test_password
          POSTGRES_DB: customer_financial_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfha -d customer_financial_health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cfha:cfha_test_password@localhost:5432/customer_financial_health_test
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.9.30
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run the locked backend test suite
        working-directory: backend
        run: uv run --frozen pytest

  generated-client:
    name: Generated client is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.9.30
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate and compare the API contract
        run: ./scripts/check-generated-client.sh

  browser-journeys:
    name: Browser journeys without Azure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_COMPOSE_PROJECT_NAME: cfha-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and its operating-system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run against a freshly built isolated application
        working-directory: frontend
        run: npm run test:e2e

  clean-environment-smoke:
    name: Clean environment and failure smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_COMPOSE_PROJECT_NAME: cfha-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Verify clean startup, persistence, and schema failures
        run: ./scripts/smoke-clean-environment.sh
